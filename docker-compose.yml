version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - BACKEND_CORS_ORIGINS=["http://localhost:5173", "http://127.0.0.1:5173"]
      - GEMMA_PROVIDER=${GEMMA_PROVIDER:-mock}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - GEMMA_MODEL_ID=google/gemma-4-preview
      - ENABLE_UNTRUSTED_EXECUTION=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./backend/tests/fixtures/demo_repo:/app/tests/fixtures/demo_repo:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
